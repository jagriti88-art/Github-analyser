name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One install at the root covers both workspaces.
      - run: npm ci

      - name: Server tests
        run: npm test

      - name: Client lint
        run: npm run lint

      - name: Client build
        run: npm run build
